<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suandok Care | Care Map Theme</title><style>
:root{--primary:#008b7d;--dark:#008b7d;--light:#e4f6f4;--bg:#ffffff;--line:#d5dfdf;--text:#383838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}header{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}h1,h2,h3,p{margin:0}h1{font-size:23px;color:var(--primary)}small,.muted{color:#777777;font-size:12px}button,select,input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--text);background:white}button{cursor:pointer}button:hover{background:var(--light)}button.primary{background:var(--primary);color:white;border-color:var(--primary)}button.active{background:var(--light);color:var(--dark);font-weight:700}aside{background:var(--dark);color:white;width:240px;padding:24px 16px;min-height:calc(100vh - 76px)}aside button{display:block;text-align:left;width:100%;margin:5px 0;background:transparent;color:#e5f0e8;border:0}aside button.active,aside button:hover{background:#ffffff24;color:white}.layout{display:flex}main{flex:1;min-width:0;padding:28px;max-width:1600px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:16px}.metric{font-size:34px;font-weight:700;color:var(--primary);margin:8px 0}.tag{display:inline-block;background:var(--light);color:var(--primary);font-size:12px;padding:5px 9px;border-radius:20px;margin:2px}.warn{background:#fff0dd;color:#9b5419}.danger{background:#fce8e6;color:#a33030}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:15px 9px;border-bottom:1px solid var(--line);text-align:left}th{color:#64766a;font-size:12px;background:#f8faf8}.scroll{overflow:auto}label{display:block;margin:15px 0 6px;font-size:13px}input:not([type=checkbox]),select{max-width:100%}.field{width:100%}.bar{height:10px;background:var(--light);border-radius:8px;margin:10px 0 20px}.fill{height:100%;background:var(--primary);border-radius:8px}.notice{background:var(--light);padding:14px;border-radius:8px;margin-bottom:16px}.task{padding:15px 0;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--primary);color:white;border-radius:12px;padding:9px 13px;font-size:24px}.demo{font-size:11px;letter-spacing:1px}.navtop{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:800px){header{height:auto;padding:15px;flex-wrap:wrap}.layout{display:block}aside{width:100%;min-height:0;display:flex;overflow:auto;padding:8px}aside button{width:auto;white-space:nowrap}aside .aside-label{display:none}main{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Care Map palette sampled from supplied screenshot */
:root{--accent:#00bca6;--primary:#008b7d;--light:#e4f6f4;--line:#d5dfdf;--text:#383838;--bg:#ffffff}body{font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif;font-size:14px}header{height:72px;padding:0 22px;position:sticky;top:0;z-index:5}h1{color:#383838;font-size:20px;font-weight:800}h2{font-size:29px;letter-spacing:-.6px}h3{font-size:15px;font-weight:750}.logo{background:var(--accent);border-radius:10px}.brand small{color:#777}.brand>div:nth-child(2):before{content:'MED CMU • SUANDOK';display:block;color:var(--primary);font-size:10px;letter-spacing:1.3px;font-weight:800}aside{background:white;color:#383838;border-right:1px solid var(--line);width:240px;min-height:calc(100vh - 72px);padding:20px 13px}aside button{color:#666;border-radius:0;font-weight:600;padding:12px 14px}aside button.active,aside button:hover{background:var(--light);color:#383838}aside button.active{box-shadow:inset 3px 0 var(--accent)}main{padding:45px clamp(24px,6vw,100px);max-width:1500px;margin:0 auto}.card{border:0;border-top:1px solid var(--line);border-radius:0;padding:20px 0;box-shadow:none;margin-bottom:18px}.grid{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0}.grid>.card{border-top:0;border-right:1px solid var(--line);padding:17px 20px;margin:0}.grid>.card:last-child{border-right:0}.metric{color:#383838;font-weight:800;font-size:32px}.fill{background:var(--accent)}.bar{height:7px;background:#edf2f2}.notice{border-radius:0;background:var(--light)}button,select,input{border-radius:3px}button.primary{background:var(--primary)}button.active{color:var(--primary)}.tag{border-radius:4px}th{background:#f7f9f9;color:#777}td,th{padding:12px 9px}.navtop button{font-size:13px}.muted,small{color:#777}@media(max-width:800px){header{position:static;height:auto;padding:15px}aside{width:100%;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:8px}main{padding:24px 16px}.grid>.card{padding:12px}.metric{font-size:25px}}
</style><header><div class="brand"><div class="logo">✚</div><div><h1>Suandok Care</h1><small>Patient Care Platform · Faculty of Medicine</small></div></div><div id="modes" class="navtop"></div></header><div class="layout"><aside id="nav"></aside><main id="main"></main></div><script>
const fields={weight:['น้ำหนัก','kg'],temp:['อุณหภูมิ','°C'],sbp:['ความดันตัวบน','mmHg'],glucose:['ระดับน้ำตาล','mg/dL'],pulse:['ชีพจร','bpm'],spo2:['SpO2','%']};const initial=()=>({programs:[{id:1,name:'ปลูกถ่ายตับ',en:'Liver Transplant',dept:'หน่วยปลูกถ่ายตับ',fields:['weight','temp','sbp'],rule:'temp',limit:38,op:'>=',status:'Published'},{id:2,name:'เบาหวาน',en:'Diabetes Care',dept:'คลินิกเบาหวาน',fields:['glucose','weight'],rule:'glucose',limit:200,op:'>=',status:'Published'},{id:3,name:'โรคไต',en:'Kidney Care',dept:'หน่วยโรคไต',fields:['weight','sbp'],rule:'sbp',limit:160,op:'>=',status:'Published'}],patients:[{id:1,name:'ผู้ป่วย A',programs:[1,2]},{id:2,name:'ผู้ป่วย B',programs:[1]},{id:3,name:'ผู้ป่วย C',programs:[2]},{id:4,name:'ผู้ป่วย D',programs:[3]},{id:5,name:'ผู้ป่วย E',programs:[1,3]}],alerts:[{id:1,p:2,pr:1,msg:'อุณหภูมิ 38.2 °C',state:'New'},{id:2,p:3,pr:2,msg:'ระดับน้ำตาล 215 mg/dL',state:'Acknowledged'}],obs:[{p:1,pr:1,f:'weight',v:65.2},{p:1,pr:1,f:'temp',v:36.8}],tasks:{}});let s=initial(),mode='team',page='overview',filter='all',patient=1,prid=1,studio=1,msg='';try{s=JSON.parse(localStorage.getItem('suandok-demo-v2'))||s}catch{};const save=()=>{try{localStorage.setItem('suandok-demo-v2',JSON.stringify(s))}catch{}};const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=id=>s.patients.find(x=>x.id===+id),pr=id=>s.programs.find(x=>x.id===+id),hn=id=>'DEMO-'+String(id).padStart(3,'0');const b=(t,a,c='')=>`<button data-a="${a}" class="${c}">${t}</button>`;const opts=(xs,v)=>xs.map(([k,t])=>`<option value="${k}" ${String(k)===String(v)?'selected':''}>${e(t)}</option>`).join('');const sel=(id,xs,v)=>`<select id="${id}">${opts(xs,v)}</select>`;const tag=(t,c='')=>`<span class="tag ${c}">${e(t)}</span>`;const card=(t,v,d)=>`<div class="card"><small>${t}</small><div class="metric">${v}</div><small>${d}</small></div>`;const val=id=>document.getElementById(id)?.value;const title=(t,d)=>`<small>${d}</small><h2 style="margin:5px 0 15px">${t}</h2>`;const panels={team:[['overview','▦  ภาพรวม'],['patients','♙  ทะเบียนผู้ป่วย'],['alerts','◉  Alert Inbox'],['enroll','＋  ลงทะเบียน']],patient:[['today','▦  กิจกรรมวันนี้'],['log','＋  บันทึกสุขภาพ'],['history','≡  ประวัติสุขภาพ'],['education','▤  ความรู้']],studio:[['config','⚙  ตั้งค่า Care Program']]};function atable(a){return `<div class="scroll"><table><tr><th>ผู้ป่วย</th><th>Care Program</th><th>รายละเอียด</th><th>สถานะ</th><th>ดำเนินการ</th></tr>${a.map(x=>`<tr><td>${e(p(x.p)?.name)}<br><small>${hn(x.p)}</small></td><td>${e(pr(x.pr)?.name)}</td><td>${e(x.msg)}</td><td>${tag(x.state,x.state==='New'?'danger':x.state==='Resolved'?'':'warn')}</td><td>${x.state==='New'?b('รับทราบ','ack:'+x.id):x.state==='Acknowledged'?b('ปิดรายการ','resolve:'+x.id):'✓'}</td></tr>`).join('')||'<tr><td colspan="5">ไม่มี Alert</td></tr>'}</table></div>`}function render(){document.getElementById('modes').innerHTML=[['team','Care Team'],['patient','Patient Portal'],['studio','Program Studio']].map(([k,t])=>b(t,'mode:'+k,mode===k?'active':'')).join('');document.getElementById('nav').innerHTML=`<div class="aside-label"><small style="color:#777777">WORKSPACE / DEMO</small><br><br></div>${panels[mode].map(([k,t])=>b(t,'page:'+k,page===k?'active':'')).join('')}<br>${b('↻ Reset demo','reset')}`;let h=msg?`<div class="notice">${e(msg)}</div>`:'';if(mode==='team'){let ps=s.patients.filter(x=>filter==='all'||x.programs.includes(+filter)),as=s.alerts.filter(x=>filter==='all'||x.pr===+filter);h+=`<div class="row">${title('Care Team Dashboard','CLINICAL WORKSPACE')}${sel('filter',[['all','ทุก Care Program'],...s.programs.map(x=>[x.id,x.name])],filter)}</div>`;if(page==='overview')h+=`<div class="grid">${card('Active Patients',ps.length,'ผู้ป่วยในระบบ')}${card('Care Programs',s.programs.filter(x=>x.status==='Published').length,'Published')}${card('Open Alerts',as.filter(x=>x.state!=='Resolved').length,'รอติดตาม')}${card('Observations',s.obs.filter(x=>filter==='all'||x.pr===+filter).length,'ข้อมูลสุขภาพ')}</div><div class="card"><h3>Care Program Overview</h3><br>${s.programs.filter(x=>filter==='all'||x.id===+filter).map(x=>{let n=s.patients.filter(y=>y.programs.includes(x.id)).length;return `<div class="row"><b>${e(x.name)}</b><small>${n} ผู้ป่วย</small></div><div class="bar"><div class="fill" style="width:${n/s.patients.length*100}%"></div></div>`}).join('')}</div><div class="card"><h3>Clinical Alert Inbox</h3>${atable(as)}</div>`;if(page==='alerts')h+=`<div class="card">${atable(as)}</div>`;if(page==='patients')h+=`<div class="card scroll"><table><tr><th>HN</th><th>ชื่อ</th><th>Care Programs</th><th>Portal</th></tr>${ps.map(x=>`<tr><td>${hn(x.id)}</td><td>${e(x.name)}</td><td>${x.programs.map(id=>tag(pr(id)?.name)).join('')}</td><td>${b('เปิด Portal','patient:'+x.id)}</td></tr>`).join('')}</table></div>`;if(page==='enroll')h+=`<div class="card"><h3>ลงทะเบียนเข้า Care Program</h3><label>ผู้ป่วย</label>${sel('ep',[['new','ผู้ป่วยสมมติใหม่'],...s.patients.map(x=>[x.id,x.name])],'new')}<label>ชื่อผู้ป่วยใหม่</label><input id="newname" placeholder="ผู้ป่วย F"><label>Care Program</label>${sel('epr',s.programs.filter(x=>x.status==='Published').map(x=>[x.id,x.name]),1)}<br><br>${b('ลงทะเบียน','enroll','primary')}</div>`}
if(mode==='patient'){let x=p(patient);h+=`<div class="row">${title('สวัสดี '+e(x.name),'MY CARE · '+hn(patient))}${sel('patientSelect',s.patients.map(x=>[x.id,x.name]),patient)}</div>${x.programs.map(id=>tag(pr(id)?.name)).join('')}<br><br>`;if(page==='today')h+=`<div class="card"><h3>แผนการดูแลวันนี้</h3>${x.programs.map(id=>`<div class="task row"><div><b>บันทึกสุขภาพ</b><br><small>${e(pr(id).name)}</small></div>${b('บันทึก','log:'+id,'primary')}</div>`).join('')}<div class="task row"><div>กิจกรรมเตือนยา (จำลอง)</div>${b(s.tasks[patient]?'✓ บันทึกแล้ว':'บันทึกกิจกรรม','med')}</div></div>`;if(page==='log'){if(!x.programs.includes(prid))prid=x.programs[0];let q=pr(prid);h+=`<div class="card"><h3>Daily Health Log</h3><label>Care Program</label>${sel('logProgram',x.programs.map(id=>[id,pr(id).name]),prid)}${q.fields.map(f=>`<label>${fields[f][0]} (${fields[f][1]})</label><input class="field" type="number" step="any" id="obs_${f}" placeholder="กรอกค่า">`).join('')}<br><br>${b('บันทึกข้อมูล','submit','primary')}<p class="muted" style="margin-top:12px">เกณฑ์จำลองเท่านั้น ไม่ใช่คำแนะนำทางการแพทย์</p></div>`}if(page==='history')h+=`<div class="card"><h3>ประวัติการบันทึก</h3><table><tr><th>ข้อมูล</th><th>ค่า</th><th>โปรแกรม</th></tr>${s.obs.filter(o=>o.p===patient).slice().reverse().map(o=>`<tr><td>${fields[o.f][0]}</td><td>${o.v} ${fields[o.f][1]}</td><td>${e(pr(o.pr).name)}</td></tr>`).join('')}</table></div>`;if(page==='education')h+=`<div class="card"><h3>Patient Education</h3>${['การบันทึกข้อมูลสุขภาพ','การเตรียมตัวก่อนพบแพทย์','การใช้งานระบบติดตามสุขภาพ'].map((t,i)=>`<div class="task row">${t}${b('อ่านบทเรียน','lesson:'+i)}</div>`).join('')}<p id="lesson" class="muted"></p></div>`}
if(mode==='studio'){let q=pr(studio);h+=`<div class="row">${title('Care Program Studio','CONFIGURATION WORKSPACE')}${b('+ สร้าง Program','create','primary')}</div><div class="row" style="justify-content:flex-start;margin-bottom:16px">${s.programs.map(x=>b(e(x.name),'studio:'+x.id,x.id===studio?'active':'')).join('')}</div><div class="card"><div class="row"><h3>Program Configuration</h3>${tag(q.status,q.status==='Draft'?'warn':'')}</div><label>ชื่อโปรแกรม</label><input class="field" id="pn" value="${e(q.name)}"><label>English name</label><input class="field" id="pe" value="${e(q.en)}"><label>หน่วยงาน</label><input class="field" id="pd" value="${e(q.dept)}"></div><div class="card"><h3>Dynamic Form Builder</h3><div class="grid">${Object.keys(fields).map(f=>`<label><input type="checkbox" id="f_${f}" ${q.fields.includes(f)?'checked':''}> ${fields[f][0]} (${fields[f][1]})</label>`).join('')}</div></div><div class="card"><h3>Clinical Rule Engine</h3><small>เงื่อนไขสมมติสำหรับทดสอบเท่านั้น</small><div class="grid"><div><label>Concept</label>${sel('rf',Object.keys(fields).map(f=>[f,fields[f][0]]),q.rule)}</div><div><label>Operator</label>${sel('op',[['>=','≥'],['>','>'],['<=','≤'],['<','<']],q.op)}</div><div><label>Threshold</label><input type="number" step="any" id="limit" value="${q.limit}"></div></div><div class="notice">THEN → สร้าง Clinical Alert ใน Care Team Inbox</div>${b('บันทึก Draft','draft')} ${b('จำลอง Publish','publish','primary')}</div>`}document.getElementById('main').innerHTML=h+'<small>PROTOTYPE · ข้อมูลสมมติทั้งหมด · ไม่เชื่อมต่อระบบโรงพยาบาล</small>'}
document.addEventListener('click',ev=>{let t=ev.target.closest('[data-a]');if(!t)return;let [a,k]=t.dataset.a.split(':');msg='';if(a==='mode'){mode=k;page=k==='team'?'overview':k==='patient'?'today':'config'}if(a==='page')page=k;if(a==='patient'){patient=+k;mode='patient';page='today'}if(a==='log'){prid=+k;page='log'}if(a==='studio')studio=+k;if(a==='ack'||a==='resolve'){s.alerts.find(x=>x.id===+k).state=a==='ack'?'Acknowledged':'Resolved';msg='อัปเดต Alert แล้ว'}if(a==='med')s.tasks[patient]=!s.tasks[patient];if(a==='enroll'){let id=val('ep'),pid=+val('epr');if(id==='new'){let n=s.patients.length+1;s.patients.push({id:n,name:val('newname').trim()||'ผู้ป่วย '+n,programs:[pid]})}else if(!p(id).programs.includes(pid))p(id).programs.push(pid);page='patients';filter='all';msg='ลงทะเบียนสำเร็จ'}if(a==='create'){studio=s.programs.length+1;s.programs.push({id:studio,name:'โปรแกรมใหม่ '+studio,en:'New Program',dept:'',fields:['weight'],rule:'weight',limit:100,op:'>=',status:'Draft'})}if(a==='draft'||a==='publish'){let fs=Object.keys(fields).filter(f=>document.getElementById('f_'+f).checked);if(!fs.includes(val('rf'))||!val('pn').trim()||val('limit')===''){msg='กรุณาระบุชื่อ Field และ Rule ให้ครบ';render();return}Object.assign(pr(studio),{name:val('pn'),en:val('pe'),dept:val('pd'),fields:fs,rule:val('rf'),op:val('op'),limit:+val('limit'),status:a==='publish'?'Published':'Draft'});msg='บันทึก Configuration แล้ว'}if(a==='submit'){let data=pr(prid).fields.filter(f=>val('obs_'+f)!==''&&Number.isFinite(+val('obs_'+f))).map(f=>({p:patient,pr:prid,f,v:+val('obs_'+f)}));if(!data.length){msg='กรุณากรอกข้อมูล';render();return}s.obs.push(...data);let n=0;for(let id of p(patient).programs){let q=pr(id),o=data.find(x=>x.f===q.rule);if(!o||q.status!=='Published')continue;let v=o.v,l=q.limit;if(q.op==='>='?v>=l:q.op==='>'?v>l:q.op==='<='?v<=l:v<l){s.alerts.push({id:s.alerts.length+1,p:patient,pr:id,msg:fields[o.f][0]+' '+v+' '+fields[o.f][1],state:'New'});n++}}msg='บันทึกสำเร็จ · สร้าง Alert '+n+' รายการ';page='history'}if(a==='lesson'){document.getElementById('lesson').textContent=['บันทึกข้อมูลตามแผนการดูแล','เตรียมรายการยาและคำถามสำหรับทีมรักษา','ตรวจสอบกิจกรรมในหน้าหลัก'][+k];return}if(a==='reset'){if(!confirm('คืนค่าข้อมูลสาธิตทั้งหมด?'))return;s=initial();mode='team';page='overview';filter='all';patient=1;prid=1;studio=1}save();render()});document.addEventListener('change',ev=>{let t=ev.target;if(t.id==='filter')filter=t.value;else if(t.id==='patientSelect')patient=+t.value;else if(t.id==='logProgram')prid=+t.value;else return;render()});render();</script></html>
